services:
  - type: web
    name: pension-integrity-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --threads 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PIM_OFFICER_KEY
        generateValue: true
      - key: PIM_SECRET
        generateValue: true
