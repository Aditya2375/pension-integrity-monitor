{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h2>Change your password</h2>
  <p class="muted">Required before first use of an account created by another officer.</p>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password</label>
    <input type="password" name="old" autocomplete="current-password">
    <label style="margin-top:12px">New password (at least 12 characters)</label>
    <input type="password" name="new" autocomplete="new-password">
    <p style="margin-top:14px"><button class="btn">Change password</button></p>
  </form>
</div>
{% endblock %}
